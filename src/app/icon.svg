<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- His initials, heavy and tight like the Stage's name: white on transparent,
       black under a light browser theme, where white would vanish. A favicon
       cannot load the page's Geist, so it asks for the platform's own sans. -->
  <style>
    text { fill: #fff; }
    @media (prefers-color-scheme: light) { text { fill: #000; } }
  </style>
  <text x="16" y="17" text-anchor="middle" dominant-baseline="central" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="-1">RK</text>
</svg>

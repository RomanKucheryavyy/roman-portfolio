# Dependency PRs. Every one runs CI (typecheck, lint, the owner-fixed copy
# check, build, the bundle budget and the e2e suite) before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next and its lint config move together, in their own PR: a Next minor
      # can change Turbopack chunking and metadata merging, so it gets its own
      # review instead of riding along with routine bumps.
      # eslint-config-next is pinned exactly at 16.3.8: 16.4 brings
      # eslint-plugin-react-hooks 7.1, whose set-state-in-effect rule errored
      # on resume/page.tsx (and on the old design's Compose.tsx, now gone).
      # The Stage's glue (src/components/stage) sets state in effects too, so
      # expect the bump to go red on lint; merge it with the fix, not before.
      next:
        patterns:
          - next
          - eslint-config-next
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - next
          - eslint-config-next
    ignore:
      # Pinned to the browsers provisioned for local runs (chromium-1194);
      # bump it deliberately, together with those browsers.
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

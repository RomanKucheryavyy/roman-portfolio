[build]
  # next build type-checks but no longer lints, and main deploys on push, so
  # this is the only lint gate production itself goes through.
  command = "npm run lint && npm run build"
  publish = ".next"

[build.environment]
  # RESUME_PIN's value is embedded by Netlify itself into the generated
  # server-handler runtime (run-config.json, tracer.cjs, server.js), which
  # the secrets scanner then flags — a false positive that fails every
  # GitHub-triggered build. The PIN never appears in client output.
  SECRETS_SCAN_OMIT_KEYS = "RESUME_PIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# public/images/* filenames carry no content hash, so they are served
# max-age=0,must-revalidate by default and every direct request for one is a
# round trip. The pages reach them through /_next/image today, which caches
# its own output; this covers the originals themselves, for anything that
# asks for one directly or loads one raw later. A day fresh, a week
# stale-while-revalidate: a re-captured screenshot still shows up within a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
